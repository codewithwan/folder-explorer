[package]
name = "folder-explorer"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A fast file explorer that shows the real size of every folder"
license = "MIT"
authors = ["KidiXDev"]
repository = "https://github.com/KidiXDev/folder-explorer"
homepage = "https://github.com/KidiXDev/folder-explorer"
keywords = ["explorer", "disk-usage", "folder-size", "slint"]
categories = ["filesystem", "gui"]

[dependencies]
md-5 = "0.10"
mimalloc = { version = "0.1", default-features = false }
raw-window-handle = "0.6"
rayon = "1.12"
sha1 = "0.10"
sha2 = "0.10"
slint = { version = "1.18", features = ["raw-window-handle-06", "renderer-skia"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Graphics_Gdi",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_Urlmon",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Time",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS / Unix port
[target.'cfg(unix)'.dependencies]
libc = "0.2"
arboard = "3"
trash = "5"
rfd = "0.15"

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.winresource]
ProductName = "Folder Explorer"
FileDescription = "Folder Explorer"
CompanyName = "KidiXDev"
LegalCopyright = "Copyright (c) 2026 KidiXDev"
OriginalFilename = "folder-explorer.exe"
InternalName = "folder-explorer"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
